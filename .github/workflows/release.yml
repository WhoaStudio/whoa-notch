name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version sans v (1, 1.2 ou 1.2.3) ; lancer depuis stable'
        required: true
        type: string

permissions:
  contents: write

# Sérialise aussi les mises à jour du cask sur stable.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'stable' || github.ref }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create version commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_CI: '1'
        run: |
          [[ "$GITHUB_REF" == refs/heads/stable ]] || { echo 'Sélectionnez stable pour publier.' >&2; exit 1; }
          python3 scripts/release-version.py "$VERSION"
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]] && git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            expected=$(printf 'v%s\n\nGitHub Actions run: %s' "$VERSION" "$GITHUB_RUN_ID")
            actual=$(git for-each-ref --format='%(contents)' "refs/tags/v$VERSION")
            [[ "$actual" == "$expected" ]] || { echo "Ce tag n'a pas été créé par cette exécution." >&2; exit 1; }
          else
            scripts/release.sh "$VERSION"
          fi

      - name: Validate tag and stable ancestry
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            tag="v$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version=${tag#v}
          git fetch origin stable --tags
          commit=$(git rev-parse "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$commit" origin/stable || {
            echo "Le commit du tag $tag n’est pas sur stable." >&2
            exit 1
          }
          git checkout --detach "$commit"
          python3 scripts/release-version.py "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build and verify DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/build-dmg.sh "$VERSION"

      - name: Publish GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="Build/release/$VERSION/signing-status.txt"
          # Réutilise l’artefact publié si seule la mise à jour du cask doit être reprise.
          published=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$published" == false ]]; then
            gh release download "$TAG" --pattern "whoa-stash-$VERSION.dmg" \
              --dir "Build/release/$VERSION" --clobber
          else
            previous=$(git describe --tags --match 'v*' --abbrev=0 "$TAG^" 2>/dev/null || true)
            args=()
            if [[ -n "$previous" ]]; then args+=(-f "previous_tag_name=$previous"); fi
            full_notes="Build/release/$VERSION/release-notes.md"
            cat "$notes" > "$full_notes"
            printf '\n' >> "$full_notes"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f "tag_name=$TAG" "${args[@]}" --jq '.body' >> "$full_notes"
            if [[ "$published" == true ]]; then
              gh release edit "$TAG" --notes-file "$full_notes"
            else
              gh release create "$TAG" --verify-tag --draft --title "Whoa Stash $TAG" \
                --notes-file "$full_notes"
            fi
            gh release upload "$TAG" "Build/release/$VERSION/whoa-stash-$VERSION.dmg" \
              "Build/release/$VERSION/SHA256SUMS" --clobber
            gh release edit "$TAG" --draft=false
          fi

  update-cask:
    needs: release
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-cask.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
